<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>My Image Gallery</h1>
    <div class="filters">
        <button class="filter" data-category="all">All </button>
        <button class="filter" data-category="nature">Nature </button>
        <button class="filter" data-category="animals">Animals </button>
        <button class="filter" data-category="cities">Cities </button>
    </div>
    <div class="gallery">
<img src="naturepic 1.jpg" data-category="nature" >
<img src="animal pic 1.webp" data-category="animals">
<img src="madinah.webp" data-category="cities">
<img src="naturepic 2.jpg" data-category="nature">
<img src="animal pic 2.jpg" data-category="animals">
<img src="makkah.jpg" data-category="cities" >
    </div>
    <div class="lightbox">
        <span class="close">&times;</span>
        <button class="prev">❮</button>
        <img src="" alt="Large Image">
        <button class="next">❯</button>
    </div>

    


    <script src="script.js"></script>
</body>
</html>
